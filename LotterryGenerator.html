<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Generator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: radial-gradient(circle, rgba(255, 115, 115, 1) 0%, rgba(255, 180, 180, 1) 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 450px;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            transform: scale(1);
            animation: popUp 0.5s ease-out;
        }
        @keyframes popUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        h1 {
            color: #ff4f6c;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 1px 1px 5px rgba(255, 80, 108, 0.8);
        }
        button {
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff4f6c, #ff91a4);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-size: 18px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 80, 108, 0.5);
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(255, 80, 108, 0.6);
        }
        input {
            width: 85%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 2px solid #ff4f6c;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        input:focus {
            border-color: #ff91a4;
            box-shadow: 0 0 8px rgba(255, 145, 164, 0.8);
        }
        #lotteryNumber, #result {
            font-size: 22px;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
        }
        #result {
            font-size: 24px;
            font-weight: 700;
        }
        .emoji {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lottery Generator</h1>

        <button onclick="generateLottery()">🎰 สุ่มเลขหวย</button>
        <p id="lotteryNumber">เลขที่ออก : ???</p>

        <h3>ลองทายเลข 6 หลัก</h3>
        <input type="text" id="userGuess" placeholder="ใส่เลข 6 หลัก" maxlength="6">
        <button onclick="checkLottery()">✅ ตรวจสอบเลขทาย</button>

        <p id="result"></p>
    </div>

    <script>
        let lotteryNumber = ""; // เก็บเลขที่ออก

        function generateLottery() {
            lotteryNumber = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById("lotteryNumber").innerText = "สุ่มตัวเลขเรียบร้อยแล้ว"; // ซ่อนเลขที่ออก
            document.getElementById("result").innerText = ""; // ล้างผลลัพธ์เก่า
            console.log(lotteryNumber);
        }

        function checkLottery() {
            let userGuess = document.getElementById("userGuess").value;

            if (userGuess.length !== 6 || isNaN(userGuess)) {
                alert("กรุณากรอกเลข 6 หลัก!");
                return;
            }

            if (lotteryNumber === "") {
                alert("กรุณากดสุ่มเลขหวยก่อน!");
                return;
            }

            if (userGuess === lotteryNumber) {
                document.getElementById("result").innerText = "🎉 ยินดีด้วย! คุณถูกหวย 🎉";
                document.getElementById("result").style.color = "green";
                document.getElementById("lotteryNumber").innerText = "เลขที่ออก : " + lotteryNumber; // เผยเลขที่ออก
            } else {
                document.getElementById("result").innerText = "❌ ไม่ถูกหวย! ลองใหม่อีกครั้ง";
                document.getElementById("result").style.color = "red";
            }
        }
    </script>
</body>
</html>
