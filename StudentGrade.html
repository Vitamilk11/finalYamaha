<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: #e3f2fd;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            font-size: 24px;
        }
        table {
            width: 100%;
            margin: 10px 0;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #007bff;
            color: white;
        }
        input {
            width: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        button {
            padding: 10px 15px;
            margin-top: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
        #result {
            font-size: 20px;
            margin-top: 15px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>คำนวณเกรดเฉลี่ย</h1>
        <table>
            <tr>
                <th>รหัสวิชา</th>
                <th>คะแนน (0-100)</th>
            </tr>
            <tr>
                <td>CSI101</td>
                <td><input type="number" id="score1" min="0" max="100"></td>
            </tr>
            <tr>
                <td>CSI102</td>
                <td><input type="number" id="score2" min="0" max="100"></td>
            </tr>
            <tr>
                <td>CSI203</td>
                <td><input type="number" id="score3" min="0" max="100"></td>
            </tr>
            <tr>
                <td>CSI204</td>
                <td><input type="number" id="score4" min="0" max="100"></td>
            </tr>
            <tr>
                <td>CSI305</td>
                <td><input type="number" id="score5" min="0" max="100"></td>
            </tr>
        </table>
        <button onclick="calculateGPA()">คำนวณเกรดเฉลี่ย</button>
        <p id="result"></p>
    </div>

    <script>
        function calculateGPA() {
            let scores = [
                parseFloat(document.getElementById("score1").value),
                parseFloat(document.getElementById("score2").value),
                parseFloat(document.getElementById("score3").value),
                parseFloat(document.getElementById("score4").value),
                parseFloat(document.getElementById("score5").value)
            ];
            
            let credits = 3;
            let totalCredits = scores.length * credits;
            let totalGradePoints = 0;

            function getGradePoint(score) {
                if (score >= 80) return 4.0;
                if (score >= 75) return 3.5;
                if (score >= 70) return 3.0;
                if (score >= 65) return 2.5;
                if (score >= 60) return 2.0;
                if (score >= 55) return 1.5;
                if (score >= 50) return 1.0;
                return 0.0;
            }

            for (let i = 0; i < scores.length; i++) {
                if (isNaN(scores[i]) || scores[i] < 0 || scores[i] > 100) {
                    alert("กรุณากรอกคะแนนระหว่าง 0 - 100 ให้ครบทุกวิชา!");
                    return;
                }
                totalGradePoints += getGradePoint(scores[i]) * credits;
            }

            let gpa = totalGradePoints / totalCredits;
            document.getElementById("result").innerHTML = `GPA: ${gpa.toFixed(2)}`;
        }
    </script>
</body>
</html>
